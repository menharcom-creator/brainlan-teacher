      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install --install-links

      - name: Create the iOS project
        run: npx cap add ios

      - name: Check the server plugin was registered
        run: |
          cat ios/App/App/capacitor.config.json
          grep -q "QuizServerPlugin" ios/App/App/capacitor.config.json || { echo "::error::QuizServerPlugin was not registered by Capacitor"; exit 1; }

      - name: Settings + icon
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string BrainLAN lets students on your Wi-Fi or hotspot join your quiz." $PL || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" $PL || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _http._tcp" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $PL || true
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          if [ -f icon-1024.png ] && [ -f "$ICON" ]; then cp icon-1024.png "$ICON"; fi

      - name: Sync web files
        run: npx cap sync ios

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Make the IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry BrainLAN-Teacher.ipa Payload
          ls -lh BrainLAN-Teacher.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BrainLAN-Teacher-IPA
          path: BrainLAN-Teacher.ipa

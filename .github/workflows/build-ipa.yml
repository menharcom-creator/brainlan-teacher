name: Build BrainLAN Teacher IPA
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node tools/build-web.js && node tools/verify.js
      - run: npx cap add ios
      - run: ruby tools/patch-ios.rb
      - run: npx cap sync ios
      - name: Build (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/BrainLAN-Teacher.ipa" Payload
      - uses: actions/upload-artifact@v4
        with: { name: BrainLAN-Teacher-ipa, path: BrainLAN-Teacher.ipa }
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: teacher-ipa-latest
          name: BrainLAN Teacher IPA (latest build)
          files: BrainLAN-Teacher.ipa

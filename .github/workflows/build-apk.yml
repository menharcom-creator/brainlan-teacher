name: Build BrainLAN Student APK
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -q -o brainlan-teacher-ios.zip
          cp -R brainlan-teacher-ios/. .
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pip install pillow
      - run: npm install
      - run: node tools/build-web.js && node tools/verify.js
      - run: cp config/capacitor.student.json capacitor.config.json
      - run: npx cap add android
      - run: python3 tools/patch-android.py
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk BrainLAN-Student.apk
      - uses: actions/upload-artifact@v4
        with: { name: BrainLAN-Student-apk, path: BrainLAN-Student.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: student-apk-latest
          name: BrainLAN Student APK (latest build)
          files: BrainLAN-Student.apk

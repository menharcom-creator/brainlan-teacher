name: Build Android TV APK (all Android versions)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p www
          cat > package.json <<'BRAINLAN_EOF_0'
          {
            "name": "brainlan-tv",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/android": "^6.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          BRAINLAN_EOF_0
          cat > capacitor.config.json <<'BRAINLAN_EOF_1'
          {
            "appId": "com.brainlan.tv",
            "appName": "BrainLAN TV",
            "webDir": "www",
            "server": { "androidScheme": "http", "cleartext": true }
          }
          BRAINLAN_EOF_1

      - name: Prepare game page
        run: |
          cat > patch.py <<'BRAINLAN_PY'
          import re,glob,base64,sys
          cands=glob.glob('*.html')
          if not cands:
              print('::error::Upload the BrainLAN game .html file to the repo (any name, in the main folder).'); sys.exit(1)
          cands.sort(key=lambda p:(p!='index.html',-len(open(p,encoding='utf-8',errors='ignore').read())))
          src=open(cands[0],encoding='utf-8').read(); print('Using game file:',cands[0])

          def rep(old,new):
              global src
              if src.count(old)>=1: src=src.replace(old,new,1)
              else: print('WARN: patch not applied:',old[:50])
          # faster, never-give-up connection (no silent fallback to demo mode on slow Wi-Fi)
          rep("function connectWS(first){let w,opened=false,t=0;","const REMOTE=!APP&&/^https?:$/.test(location.protocol)&&!/^(localhost|127\\.0\\.0\\.1|\\[::1\\])$/.test(location.hostname);\nfunction connectWS(first){let w,opened=false,t=0;")
          rep("if(first)t=setTimeout(()=>{if(!opened){try{w.close()}catch(e){}if(APP){$('#jStat').textContent='Cannot reach the teacher at '+SRV;$('#jStat').className='chip bad'}else useBC()}},2500);","if(first)t=setTimeout(()=>{if(!opened){if(REMOTE||APP){$('#jStat').textContent='Still connecting to the teacher… check the Wi-Fi';$('#jStat').className='chip wait'}else{try{w.close()}catch(e){}useBC()}}},(REMOTE||APP)?8000:2500);")
          rep("else if(!first)setTimeout(()=>connectWS(false),1500)}}","else if(!first||REMOTE||APP)setTimeout(()=>connectWS(false),1000)}}")
          rep('placeholder="192.168.43.100:3000" inputmode="url" autocapitalize="none" autocomplete="off"></div>','placeholder="172.20.10.1:8080" inputmode="url" autocapitalize="none" autocomplete="off"><button class="btn" type="button" style="font-size:14px;min-height:40px;padding:8px 12px;margin:0 0 10px;background:#868e96" onclick="$(\'#jHost\').value=\'127.0.0.1:8080\'">📲 Teacher app is on this iPhone</button></div>')

          rep('<div class="card"><b>Connection modes:</b>','<div class="card" id="connHelp"><b>Connection modes:</b>')
          rep("$('#conn').textContent='● Teacher: host from this iPhone · Student: join with the teacher address';","$('#conn').textContent='● Student app';$('#hostBtn').style.display='none';$('#connHelp').style.display='none';")
          rep("$('#jHostWrap').style.display='block';$('#jHost').value=SRV;","$('#jHost').value=SRV;")
          rep("show('home');document.querySelectorAll('img.appicon')","if(APP&&!sessionStorage.getItem('smq'))setTimeout(goStudent,50);\nshow('home');document.querySelectorAll('img.appicon')")


          TV=r'''<style>:focus{outline:4px solid #ffd43b!important;outline-offset:3px}</style>
          <script>(function(){var q='[onclick]:not(button):not(a):not(input):not(select):not(textarea):not([tabindex])';function mk(){var l=document.querySelectorAll(q);for(var i=0;i<l.length;i++)l[i].setAttribute('tabindex','0')}
          new MutationObserver(mk).observe(document.documentElement,{childList:true,subtree:true});mk();
          function fit(){var z=Math.max(1,Math.min(1.8,window.innerWidth/820));document.documentElement.style.zoom=z}fit();window.addEventListener('resize',fit);
          document.addEventListener('keydown',function(e){var t=document.activeElement;if((e.key==='Enter'||e.keyCode===23||e.keyCode===66)&&t&&t.hasAttribute&&t.hasAttribute('onclick')&&!/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(t.tagName)){t.click();e.preventDefault()}},true)})()</script>'''
          src=src.replace('</body>',TV+'</body>',1)
          open('www/index.html','w',encoding='utf-8').write(src)
          m=re.search(r'rel="apple-touch-icon" href="data:image/png;base64,([^"]+)"',src)
          if m: open('icon-src.png','wb').write(base64.b64decode(m.group(1))); print('icon extracted')
          BRAINLAN_PY
          python3 patch.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Make the game run on old TVs (modern JavaScript to old JavaScript)
        run: |
          cat > lower.py <<'BRAINLAN_LOW'
          import re,subprocess
          s=open('www/index.html',encoding='utf-8').read()
          ms=list(re.finditer(r'<script>(.*?)</script>',s,re.S))
          if not ms: raise SystemExit(0)
          m=max(ms,key=lambda x:len(x.group(1)))
          open('big.js','w',encoding='utf-8').write(m.group(1))
          r=subprocess.run(['npx','--yes','esbuild@0.21.5','big.js','--target=chrome55'],capture_output=True,text=True)
          if r.returncode==0 and len(r.stdout)>1000:
              s=s[:m.start(1)]+r.stdout.replace('</script','<\\/script')+s[m.end(1):]
              open('www/index.html','w',encoding='utf-8').write(s); print('JavaScript lowered for old WebViews')
          else: print('WARN: kept original JavaScript',r.stderr[:300])
          BRAINLAN_LOW
          python3 lower.py

      - name: Create the Android project
        run: npx cap add android

      - name: Set the app icon (Android)
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow || pip install --quiet pillow
          cat > mkicon.py <<'BRAINLAN_ICON'
          import os
          from PIL import Image, ImageDraw
          BG = (59, 47, 176, 255)
          src = None
          for p in ['AppIcon-512@2x.png', 'icon-src.png', 'icon-1024.png']:
              if os.path.exists(p):
                  src = Image.open(p).convert('RGBA')
                  print('icon from', p)
                  break
          if src is None:
              print('no icon file found; keeping the default icon')
              raise SystemExit(0)
          w, h = src.size
          s = min(w, h)
          src = src.crop(((w - s) // 2, (h - s) // 2, (w - s) // 2 + s, (h - s) // 2 + s))
          flat = Image.new('RGBA', src.size, BG)
          flat.alpha_composite(src)
          flat = flat.convert('RGB')
          def avg(img, box):
              reg = img.crop(box).resize((1, 1), Image.BOX)
              return reg.getpixel((0, 0))
          n = max(4, int(s * 0.06))
          c1 = avg(flat, (0, 0, n, n))
          c2 = avg(flat, (s - n, s - n, s, s))
          res = 'android/app/src/main/res'
          dens = [('mdpi', 48, 108), ('hdpi', 72, 162), ('xhdpi', 96, 216), ('xxhdpi', 144, 324), ('xxxhdpi', 192, 432)]
          for d, l, f in dens:
              folder = res + '/mipmap-' + d
              os.makedirs(folder, exist_ok=True)
              sq = flat.resize((l, l), Image.LANCZOS)
              mask = Image.new('L', (l * 4, l * 4), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, l * 4 - 1, l * 4 - 1), radius=int(l * 4 * 0.2), fill=255)
              mask = mask.resize((l, l), Image.LANCZOS)
              a = sq.convert('RGBA')
              a.putalpha(mask)
              a.save(folder + '/ic_launcher.png')
              cm = Image.new('L', (l * 4, l * 4), 0)
              ImageDraw.Draw(cm).ellipse((0, 0, l * 4 - 1, l * 4 - 1), fill=255)
              cm = cm.resize((l, l), Image.LANCZOS)
              r = sq.convert('RGBA')
              r.putalpha(cm)
              r.save(folder + '/ic_launcher_round.png')
              inner = int(f * 0.70)
              fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              pic = flat.resize((inner, inner), Image.LANCZOS).convert('RGBA')
              fg.paste(pic, ((f - inner) // 2, (f - inner) // 2))
              fg.save(folder + '/ic_launcher_foreground.png')
              bgimg = Image.new('RGB', (f, f))
              px = bgimg.load()
              for yy in range(f):
                  for xx in range(f):
                      t = (xx + yy) / (2.0 * (f - 1))
                      px[xx, yy] = (int(c1[0] + (c2[0] - c1[0]) * t), int(c1[1] + (c2[1] - c1[1]) * t), int(c1[2] + (c2[2] - c1[2]) * t))
              bgimg.save(folder + '/ic_launcher_background.png')
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/ic_launcher_background.xml', 'w').write("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#3B2FB0</color>
          </resources>
          """)
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          adaptive = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """
          open(res + '/mipmap-anydpi-v26/ic_launcher.xml', 'w').write(adaptive)
          open(res + '/mipmap-anydpi-v26/ic_launcher_round.xml', 'w').write(adaptive)
          print('launcher icons written')
          BRAINLAN_ICON
          python3 mkicon.py
          ls -l android/app/src/main/res/mipmap-xxxhdpi/

      - name: Add automatic teacher discovery (Android)
        run: |
          D=android/app/src/main/java/com/brainlan/tv
          mkdir -p $D
          cat > $D/BrainDiscoverPlugin.java <<'BRAINLAN_JAVA1'
          package com.brainlan.tv;

          import android.content.Context;
          import android.net.nsd.NsdManager;
          import android.net.nsd.NsdServiceInfo;
          import android.net.wifi.WifiManager;
          import android.os.Handler;
          import android.os.Looper;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.net.Inet4Address;

          /** Finds the teacher's BrainLAN server on the same Wi-Fi (the teacher iPhone app advertises "BrainLAN"). */
          @CapacitorPlugin(name = "BrainDiscover")
          public class BrainDiscoverPlugin extends Plugin {
              private NsdManager nsd;
              private NsdManager.DiscoveryListener listener;
              private WifiManager.MulticastLock lock;
              private boolean done = false;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @PluginMethod
              public void find(final PluginCall call) {
                  stop();
                  done = false;
                  Context ctx = getContext();
                  nsd = (NsdManager) ctx.getSystemService(Context.NSD_SERVICE);
                  try {
                      WifiManager wm = (WifiManager) ctx.getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      lock = wm.createMulticastLock("brainlan");
                      lock.setReferenceCounted(false);
                      lock.acquire();
                  } catch (Exception e) {
                      // ignore
                  }
                  listener = new NsdManager.DiscoveryListener() {
                      @Override public void onStartDiscoveryFailed(String serviceType, int errorCode) { finish(call, ""); }
                      @Override public void onStopDiscoveryFailed(String serviceType, int errorCode) { }
                      @Override public void onDiscoveryStarted(String serviceType) { }
                      @Override public void onDiscoveryStopped(String serviceType) { }
                      @Override public void onServiceLost(NsdServiceInfo serviceInfo) { }
                      @Override public void onServiceFound(NsdServiceInfo info) {
                          String name = info.getServiceName();
                          if (name != null && name.startsWith("BrainLAN")) {
                              try {
                                  nsd.resolveService(info, new NsdManager.ResolveListener() {
                                      @Override public void onResolveFailed(NsdServiceInfo i, int errorCode) { }
                                      @Override public void onServiceResolved(NsdServiceInfo i) {
                                          if (i.getHost() instanceof Inet4Address) {
                                              finish(call, i.getHost().getHostAddress() + ":" + i.getPort());
                                          }
                                      }
                                  });
                              } catch (Exception e) {
                                  // another resolve is running; the next callback will try again
                              }
                          }
                      }
                  };
                  try {
                      nsd.discoverServices("_http._tcp", NsdManager.PROTOCOL_DNS_SD, listener);
                  } catch (Exception e) {
                      finish(call, "");
                      return;
                  }
                  handler.postDelayed(new Runnable() { @Override public void run() { finish(call, ""); } }, 8000);
              }

              private synchronized void finish(PluginCall call, String addr) {
                  if (done) return;
                  done = true;
                  stop();
                  JSObject o = new JSObject();
                  o.put("addr", addr);
                  call.resolve(o);
              }

              private void stop() {
                  try { if (nsd != null && listener != null) nsd.stopServiceDiscovery(listener); } catch (Exception e) { }
                  listener = null;
                  try { if (lock != null && lock.isHeld()) lock.release(); } catch (Exception e) { }
              }
          }
          BRAINLAN_JAVA1
          cat > $D/MainActivity.java <<'BRAINLAN_JAVA2'
          package com.brainlan.tv;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(BrainDiscoverPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          BRAINLAN_JAVA2

      - name: Support old and new Android (5.1 to latest) + plain-http to teacher
        run: |
          F=android/variables.gradle
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 22/' $F
          cat $F
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic $M || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/><application#' $M
          grep -n "application" $M | head -3


      - name: Android TV settings (TV launcher, remote control, banner)
        run: |
          cat > tvset.py <<'BRAINLAN_TV'
          import re,os
          from PIL import Image,ImageDraw,ImageFont
          M='android/app/src/main/AndroidManifest.xml'
          s=open(M,encoding='utf-8').read()
          feats='<uses-feature android:name="android.software.leanback" android:required="false"/><uses-feature android:name="android.hardware.touchscreen" android:required="false"/><uses-feature android:name="android.hardware.wifi" android:required="false"/>'
          if 'leanback' not in s: s=s.replace('<application',feats+'<application',1)
          if 'android:banner' not in s: s=s.replace('<application','<application android:banner="@drawable/tv_banner"',1)
          if 'LEANBACK_LAUNCHER' not in s:
              s,n=re.subn(r'(<category android:name="android.intent.category.LAUNCHER"\s*/>)',r'\1<category android:name="android.intent.category.LEANBACK_LAUNCHER"/>',s,1)
              print('leanback launcher added:',n)
          open(M,'w',encoding='utf-8').write(s)
          os.makedirs('android/app/src/main/res/drawable',exist_ok=True)
          ic=None
          for p in ['AppIcon-512@2x.png','icon-src.png']:
              if os.path.exists(p): ic=Image.open(p).convert('RGBA'); break
          b=Image.new('RGB',(320,180),(59,47,176)); d=ImageDraw.Draw(b)
          for yy in range(180): d.line([(0,yy),(320,yy)],fill=(59-int(yy*.12),47-int(yy*.1),176-int(yy*.2)))
          if ic is not None:
              ic=ic.resize((120,120),Image.LANCZOS); b.paste(ic,(24,30),ic)
          try: f=ImageFont.load_default(size=40)
          except TypeError: f=ImageFont.load_default()
          d.text((158,66),'BrainLAN',font=f,fill=(255,255,255)); 
          b.save('android/app/src/main/res/drawable/tv_banner.png')
          print('TV banner written')
          BRAINLAN_TV
          python3 tvset.py
          grep -n -E "leanback|LEANBACK|banner|touchscreen" android/app/src/main/AndroidManifest.xml | head

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK (debug-signed, installs on every phone)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh $APK
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging $APK | grep -E "sdkVersion|targetSdkVersion|native-code" || true
          cp $APK BrainLAN-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BrainLAN-TV-APK
          path: BrainLAN-TV.apk
